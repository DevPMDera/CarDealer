<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Vehicle</title>


    <style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 40px 20px;
    min-height: 100vh;
    background: #f5f7fa;
    font-family: Arial, Helvetica, sans-serif;
    color: #222;
}

#adminLogin,
#adminPanel {
    width: 100%;
    max-width: 900px;
    margin: 0 auto;
    background: #fff;
    padding: 35px;
    border-radius: 14px;
    box-shadow: 0 10px 35px rgba(0,0,0,0.08);
}

#adminLogin {
    max-width: 450px;
    margin-top: 80px;
    text-align: center;
}

h2 {
    margin: 0 0 25px;
    font-size: 28px;
    color: #111;
}

#adminLogin h2 {
    margin-bottom: 30px;
}

input,
textarea,
select {
    width: 100%;
    padding: 13px 15px;
    border: 1px solid #d9dde3;
    border-radius: 8px;
    font-size: 15px;
    outline: none;
    background: #fff;
    transition: 0.2s ease;
}

input:focus,
textarea:focus,
select:focus {
    border-color: #111;
    box-shadow: 0 0 0 3px rgba(0,0,0,0.06);
}

textarea {
    min-height: 140px;
    resize: vertical;
}

button {
    border: none;
    border-radius: 8px;
    padding: 13px 22px;
    background: #111;
    color: #fff;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: 0.2s ease;
}

button:hover {
    background: #333;
    transform: translateY(-1px);
}

#sendOtpBtn,
#verifyOtpBtn {
    width: 100%;
    margin-top: 15px;
}

#backToEmailBtn {
    margin-top: 10px;
    background: #e9ecef;
    color: #222;
}

#backToEmailBtn:hover {
    background: #dfe3e7;
}

#logoutBtn {
    float: right;
    margin-top: -55px;
    background: #dc3545;
}

#logoutBtn:hover {
    background: #b02a37;
}

#loginMessage {
    margin-top: 20px;
    font-size: 14px;
    min-height: 20px;
}

#adminPanel form {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 18px;
}

#adminPanel form input,
#adminPanel form textarea,
#adminPanel form label,
#adminPanel form button {
    width: 100%;
}

#adminPanel form textarea {
    grid-column: 1 / -1;
}

#adminPanel form input[type="file"] {
    padding: 10px;
    background: #f8f9fa;
}

#adminPanel form label {
    font-size: 14px;
    font-weight: 600;
    margin-bottom: -12px;
}

#adminPanel form button[type="submit"] {
    grid-column: 1 / -1;
    padding: 15px;
    margin-top: 5px;
}

        .vehicle-management {
    margin-top: 45px;
    padding-top: 30px;
    border-top: 1px solid #e5e7eb;
}

.vehicle-management-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    gap: 20px;
    margin-bottom: 20px;
}

.vehicle-management-header h3 {
    margin: 0 0 6px;
    font-size: 22px;
}

.vehicle-management-header p {
    margin: 0;
    color: #6b7280;
    font-size: 14px;
}

.vehicle-filters {
    display: flex;
    gap: 10px;
}

.vehicle-filters input,
.vehicle-filters select {
    width: auto;
    min-width: 180px;
}

.vehicle-table-wrapper {
    width: 100%;
    overflow-x: auto;
    border: 1px solid #dfe3e8;
    border-radius: 10px;
    background: #fff;
}

.vehicle-table {
    width: 100%;
    min-width: 1000px;
    border-collapse: collapse;
    font-size: 14px;
}

.vehicle-table th {
    background: #f1f3f5;
    color: #343a40;
    font-weight: 700;
    text-align: left;
    padding: 13px 14px;
    border-bottom: 2px solid #d9dde3;
    white-space: nowrap;
}

.vehicle-table td {
    padding: 13px 14px;
    border-bottom: 1px solid #e9ecef;
    white-space: nowrap;
    vertical-align: middle;
}

.vehicle-table tbody tr:hover {
    background: #f8f9fa;
}

.vehicle-table tbody tr:last-child td {
    border-bottom: none;
}

.vehicle-name {
    font-weight: 600;
    color: #111;
}

.status-badge {
    display: inline-block;
    padding: 5px 9px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 700;
}

.status-available {
    background: #d1e7dd;
    color: #0f5132;
}

.status-reserved {
    background: #f8d7da;
    color: #842029;
}

.status-pending {
    background: #fff3cd;
    color: #664d03;
}

.status-other {
    background: #e9ecef;
    color: #495057;
}

.table-message {
    text-align: center;
    padding: 30px !important;
    color: #6c757d;
}

@media (max-width: 650px) {
    body {
        padding: 20px 12px;
    }

    #adminLogin,
    #adminPanel {
        padding: 25px 20px;
    }

    #adminLogin {
        margin-top: 40px;
    }

    #adminPanel form {
        grid-template-columns: 1fr;
    }

    #adminPanel form textarea,
    #adminPanel form button[type="submit"] {
        grid-column: auto;
    }

    .vehicle-management-header {
    align-items: stretch;
    flex-direction: column;
}

.vehicle-filters {
    flex-direction: column;
}

.vehicle-filters input,
.vehicle-filters select {
    width: 100%;
}
    
    .logout-btn {
        width: auto;
        padding: 7px 12px;
        font-size: 13px;
        position: absolute;
        top: 15px;
        right: 15px;
    }
}
</style>
</head>

<body>

<div id="adminLogin">
    <h2>Admin Login</h2>

    <div id="emailStep">
        <input type="email" id="adminEmail" placeholder="Admin Email" required>
        <button type="button" id="sendOtpBtn">Send OTP</button>
    </div>

    <div id="otpStep" style="display:none;">
        <p>Enter the 6-digit code sent to your email.</p>
        <input type="text" id="adminOtp" placeholder="6-digit OTP" maxlength="6" inputmode="numeric">
        <button type="button" id="verifyOtpBtn">Verify OTP</button>
        <button type="button" id="backToEmailBtn">Change Email</button>
    </div>

    <p id="loginMessage"></p>
</div>

<div id="adminPanel" style="display:none;">

    <h2>Add Vehicle</h2>

    <button type="button" id="logoutBtn">Logout</button>

    <br><br>

    <form id="carForm">

        <input type="text" id="make" placeholder="Make" required>

        <input type="text" id="model" placeholder="Model" required>

        <input type="number" id="year" placeholder="Year" required>

        <input type="number" id="price" placeholder="Price" required>

        <input type="number" id="mileage" placeholder="Mileage">

        <input type="text" id="transmission" placeholder="Transmission">

        <input type="text" id="fuelType" placeholder="Fuel Type">

        <input type="text" id="color" placeholder="Color">

        <input type="text" id="location" placeholder="Location">

        <input type="text" id="vin" placeholder="Enter VIN Number">

        <textarea id="description" placeholder="Vehicle Description"></textarea>


        <label>Cover Image</label><br>

        <input type="file" id="coverImage" accept="image/*">
        <br><br>


        <label>Gallery Images (Maximum 7)</label>

        <input type="file" id="galleryImages" accept="image/*" multiple>


        <button type="submit">
            Save Vehicle
        </button>

    </form>

    <div class="vehicle-management">
    <div class="vehicle-management-header">
        <div>
            <h3>Vehicle Management</h3>
            <p>Manage vehicles currently in the inventory.</p>
        </div>

        <div class="vehicle-filters">
            <input
                type="search"
                id="vehicleSearch"
                placeholder="Search vehicles..."
            >

            <select id="vehicleStatusFilter">
                <option value="all">All Statuses</option>
                <option value="Available">Available</option>
                <option value="Reserved">Reserved</option>
                <option value="Payment Pending">Payment Pending</option>
            </select>
        </div>
    </div>

    <div class="vehicle-table-wrapper">
        <table class="vehicle-table">
            <thead>
                <tr>
                    <th>Vehicle</th>
                    <th>Year</th>
                    <th>Price</th>
                    <th>Mileage</th>
                    <th>Fuel</th>
                    <th>Location</th>
                    <th>Status</th>
                    <th>Featured</th>
                    <th>Actions</th>
                </tr>
            </thead>

            <tbody id="vehicleTableBody">
                <tr>
                    <td colspan="9" class="table-message">
                        Loading vehicles...
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/appwrite@17.0.0"></script>
<script src="assets/js/appwrite.js"></script>
<script src="assets/js/admin-add-car.js"></script>


</body>

</html>
